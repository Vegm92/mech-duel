<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body { margin: 0; height: 100%; background: #0b0e13; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
body.menu canvas { cursor: default; }
#menu { position: fixed; left: 2em; top: 50%; transform: translateY(-50%); width: 21em; max-height: calc(100vh - 2em); overflow-y: auto; box-sizing: border-box; padding: 1.3em 1.5em; background: rgba(8,22,46,0.95); box-shadow: inset 0 0 0 1.5px rgba(80,150,230,0.45); clip-path: polygon(1em 0, 100% 0, 100% calc(100% - 1em), calc(100% - 1em) 100%, 0 100%, 0 1em); color: #e8f2ff; font: 600 clamp(13px, calc(0.75vw + 4px), 20px) 'Segoe UI', system-ui, sans-serif; }
#menu[hidden], #menu [hidden] { display: none; }
#menu h2 { margin: 0 0 0.7em; font-size: 1.6em; font-weight: 900; letter-spacing: 0.06em; text-shadow: 0 0 0.5em rgba(95,180,255,0.9); }
#menu h3 { margin: 1.1em 0 0.5em; font-size: 0.8em; font-weight: 800; letter-spacing: 0.12em; color: #5d84b8; }
#menu button { display: block; width: 100%; margin: 0 0 0.45em; padding: 0.55em 0.9em; border: 1px solid rgba(80,150,230,0.45); background: rgba(10,28,58,0.92); color: #e8f2ff; font: inherit; text-align: left; letter-spacing: 0.04em; cursor: pointer; }
#menu button:hover, #menu button:focus-visible { background: rgba(26,66,124,0.97); border-color: rgba(160,215,255,0.95); outline: none; }
#menu button.main { background: linear-gradient(#ff9f58, #c4521a); border-color: #ffd2a8; color: #1a0d05; font-weight: 900; }
#menu button.main:hover, #menu button.main:focus-visible { filter: brightness(1.15); }
#menu label { display: grid; grid-template-columns: 7.5em 1fr 2.8em; align-items: center; gap: 0.6em; margin: 0.3em 0; font-size: 0.9em; }
#menu input { width: 100%; accent-color: #5fb4ff; cursor: pointer; }
#menu output { text-align: right; color: #7fa6d6; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas></canvas>
<div id="menu" hidden>
  <h2></h2>
  <button class="main" data-act="resume"></button>
  <button class="match" data-act="restart" data-t="mRestart"></button>
  <button class="match" data-act="garage" data-t="mGarage"></button>
  <h3 data-t="mSound"></h3>
  <label><span data-t="vMaster"></span><input type="range" max="100" data-vol="master"><output></output></label>
  <label><span data-t="vMusic"></span><input type="range" max="100" data-vol="music"><output></output></label>
  <label><span data-t="vSfx"></span><input type="range" max="100" data-vol="sfx"><output></output></label>
  <label><span data-t="vEnv"></span><input type="range" max="100" data-vol="env"><output></output></label>
  <label><span data-t="vCrowd"></span><input type="range" max="100" data-vol="crowd"><output></output></label>
  <h3 data-t="mGame"></h3>
  <button data-act="lang"></button>
  <button data-act="view"></button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
