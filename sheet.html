<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mechart sheet</title>
<style>
html, body { margin: 0; background: #0b0e13; }
canvas { display: block; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
import { drawMech, drawPortrait } from './src/mechart.js'
import { CATALOG, DEFAULT_LOADOUT, ULT_RECOVERY, ULTS, maxArmor } from './src/sim.js'

const q = new URLSearchParams(location.search)
const only = q.get('slot')
const freeze = q.get('act')
const id = Number(q.get('id') ?? 0)
const z = Number(q.get('z') ?? 1)
const dmg = q.get('dmg') !== '0'
const view = q.get('view') ?? 'all'
const top = view !== 'front'
const front = view !== 'top'
const slots = Object.keys(CATALOG).filter(s => !only || s === only)
const cells = slots.flatMap(slot => Object.keys(CATALOG[slot]).map(key => ({ slot, key })))
const COLS = Number(q.get('cols') ?? 3)
const CW = (top ? (dmg ? 300 : 120) : 0) + (front ? 110 : 0) + 10
const CH = 160
const canvas = document.querySelector('canvas')
const ctx = canvas.getContext('2d')
const dpr = (devicePixelRatio || 1) * z
canvas.width = COLS * CW * dpr
canvas.height = Math.ceil(cells.length / COLS) * CH * dpr
canvas.style.width = `${COLS * CW * z}px`
canvas.style.height = `${Math.ceil(cells.length / COLS) * CH * z}px`
const failed = new Set()

function action(slot, key, now) {
  const k = { left: 'left', right: 'right', head: 'ult' }[slot]
  if (!k) return { act: null, kickAt: -1e9 }
  const row = slot === 'head' ? ULTS.lance : CATALOG[slot][key]
  const wind = row.windup
  const gap = row.hits > 1 ? row.gap : 0
  const rec = slot === 'head' ? ULT_RECOVERY : row.recovery
  if (freeze === 'wind') return { act: { k, ph: 'wind', t: 2 }, kickAt: -1e9 }
  if (freeze === 'rec') return { act: { k, ph: 'rec', t: rec }, kickAt: { [k]: now } }
  if (freeze === 'idle') return { act: null, kickAt: -1e9 }
  const total = wind + gap + rec + 40
  const tick = Math.floor(now / (1000 / 60)) % total
  const fired = now - (tick - wind) * (1000 / 60)
  if (tick < wind) return { act: { k, ph: 'wind', t: wind - tick }, kickAt: { [k]: fired - total * (1000 / 60) } }
  if (tick < wind + gap) return { act: { k, ph: 'combo', t: wind + gap - tick, n: 1 }, kickAt: { [k]: fired } }
  if (tick < wind + gap + rec) return { act: { k, ph: 'rec', t: wind + gap + rec - tick }, kickAt: { [k]: fired } }
  return { act: null, kickAt: { [k]: fired } }
}

function mech(loadout, frac, act, moving) {
  const max = maxArmor(loadout)
  const armor = Object.fromEntries(Object.entries(max).map(([p, v]) => [p, Math.round(v * frac)]))
  return {
    id, preview: true, x: 0, y: 0, vx: 0, vy: moving ? -5 : 0, aim: -Math.PI / 2, loadout, max, armor,
    heat: 0, overheat: 0, surge: 0, cd: { left: 0, right: 0, hook: 0, shield: 0, dash: 0 }, act, stagger: 0, pull: null, ko: false,
  }
}

function cell({ slot, key }, x0, y0, now) {
  const loadout = { ...DEFAULT_LOADOUT, head: id ? 'pincer' : 'horn', [slot]: key }
  ctx.fillStyle = '#131821'
  ctx.fillRect(x0 + 2, y0 + 2, CW - 4, CH - 4)
  ctx.fillStyle = '#8b96a8'
  ctx.font = '600 13px ui-monospace, Consolas, monospace'
  ctx.textBaseline = 'top'
  ctx.fillText(`${slot}.${key}`, x0 + 10, y0 + 8)
  const { act, kickAt } = action(slot, key, now)
  const S = 28 / 0.6
  const v = cx => ({ X: () => cx, Y: () => y0 + 95, S, u: 1, now })
  const lg = { phase: now / 220, heading: -Math.PI / 2 + Number(q.get('hd') ?? 0) }
  const states = !top ? [] : dmg ? [[1, act, true], [0.3, null, false], [0, null, false]] : [[1, act, true]]
  states.forEach(([frac, a, moving], i) => {
    const cx = x0 + 65 + i * 95
    drawMech(ctx, mech(loadout, frac, a, moving), v(cx), lg, i ? null : kickAt)
  })
  if (front) drawPortrait(ctx, loadout, id, x0 + CW - 60, y0 + 98, 17, now)
}

function frame(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.fillStyle = '#0b0e13'
  ctx.fillRect(0, 0, COLS * CW, canvas.height)
  cells.forEach((c, i) => {
    ctx.save()
    try {
      cell(c, (i % COLS) * CW, Math.floor(i / COLS) * CH, now)
    } catch (e) {
      if (!failed.has(c.key)) console.error(c.slot, c.key, e)
      failed.add(c.key)
    }
    ctx.restore()
  })
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
